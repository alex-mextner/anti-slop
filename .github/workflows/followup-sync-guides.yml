name: Follow-up sync vendored guides
on:
  push:
    branches: [fix/vendor-rule-guides]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vendor-rule-guides
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:skill-assets
      - run: pnpm test
      - name: Commit generated payload and remove one-shot workflow
        run: |
          rm .github/workflows/followup-sync-guides.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: include rule guides in install payload"
          git push origin HEAD:fix/vendor-rule-guides
